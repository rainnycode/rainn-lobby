<style>
/* Layout: full-screen 3D scene; HUD on the edges; content opens in a side panel (desktop) or bottom sheet (phone). Single dark look on purpose. */
:root {
  --bg: #050608;
  --panel: #0c0e12;
  --panel-2: #14171d;
  --line: #262a32;
  --fg: #f1f1f1;
  --muted: #b3b8c2;
  --dim: #7d838e;
  --red: #ff2338;
  --red-soft: #ff5c6c;

  --display: "Inter Tight", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
body.desktop #scene { cursor: none; }
body.desktop.panel-open #scene { cursor: default; }

/* crosshair */
#mira { position: fixed; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; pointer-events: none; z-index: 5; transition: transform .18s ease, opacity .2s; will-change: transform; }
#mira svg { width: 100%; height: 100%; overflow: visible; transition: transform .25s ease; }
#mira .ring { fill: none; stroke: var(--red); stroke-width: 2.4; opacity: .9; }
#mira .tick { stroke: var(--red); stroke-width: 2.4; }
#mira .dot { fill: var(--red); }
#mira.locked svg { transform: rotate(45deg) scale(.82); }
#mira.locked .ring { stroke-width: 3.2; opacity: 1; filter: drop-shadow(0 0 6px rgba(255,35,56,.8)); }
body.touch #mira { left: 50%; top: 50%; }
body.panel-open #mira { opacity: 0; }

#lock-label { position: fixed; z-index: 6; pointer-events: none; transform: translate(26px, -50%); display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; background: rgba(5,6,8,.82); border: 1px solid var(--line); border-left: 3px solid var(--red); white-space: nowrap; }
#lock-label .n { font-family: var(--display); font-weight: 700; font-size: 17px; }
#lock-label .s { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
body.touch #lock-label { left: 50% !important; top: calc(50% + 46px) !important; transform: translate(-50%, 0); align-items: center; pointer-events: auto; }
#open-chip { display: none; margin-top: 6px; font-family: var(--mono); font-size: 13px; font-weight: 700; color: #fff; background: var(--red); border: 0; padding: 8px 14px; cursor: pointer; }
body.touch #open-chip { display: block; }

/* HUD */
.hud-top { position: fixed; z-index: 4; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.brand { display: flex; flex-direction: column; gap: 2px; pointer-events: auto; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.03em; line-height: 1; }
.brand span { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.proto { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-top: 6px; }
.map-wrap { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#minimap { width: 144px; height: 120px; background: rgba(5,6,8,.75); border: 1px solid var(--line); display: block; }
.map-wrap span { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }

.hud-bottom { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(to top, rgba(5,6,8,.92), rgba(5,6,8,0)); padding-top: 28px; }
#menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 1100px; margin: 0 auto; }
#menu button { font-family: var(--body); font-size: 14px; font-weight: 600; color: var(--fg); background: rgba(20,23,29,.85); border: 1px solid var(--line); padding: 9px 12px; min-height: 40px; cursor: pointer; }
#menu button:hover, #menu button.hot { border-color: var(--red); color: #fff; }
#menu button:focus-visible, .panel button:focus-visible, .panel a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
@media (max-width: 700px) {
  #menu { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
  #menu::-webkit-scrollbar { display: none; }
  #menu button { flex: 0 0 auto; }
  #minimap { width: 104px; height: 88px; }
  .brand b { font-size: 24px; }
}
body.panel-open.touch .hud-bottom { display: none; }
@media (min-width: 701px) and (pointer: fine) { body.panel-open .hud-bottom { right: min(480px, 100%); } }

/* hint + intro */
#hint { position: fixed; z-index: 4; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); font-family: var(--mono); font-size: 13px; letter-spacing: .06em; color: var(--fg); background: rgba(5,6,8,.85); border: 1px solid var(--line); padding: 10px 14px; opacity: 0; transition: opacity .4s; pointer-events: none; text-align: center; max-width: calc(100% - 32px); }
#hint.show { opacity: 1; }
#intro { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: opacity .6s; }
#intro.gone { opacity: 0; pointer-events: none; }
#intro .bar { width: 220px; height: 4px; background: var(--line); }
#intro .bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width .25s; }
#intro .t { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
#intro h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6vw, 48px); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
#intro button { font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: .08em; color: #fff; background: var(--red); border: 0; padding: 14px 22px; cursor: pointer; text-transform: uppercase; }
#intro .demo { width: 64px; height: 64px; }

/* panel */
.panel { position: fixed; z-index: 10; background: var(--panel); border-left: 1px solid var(--line); top: 0; right: 0; bottom: 0; width: min(480px, 100%); transform: translateX(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.panel.open { transform: none; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.panel-head .eb { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--red-soft); }
#back { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); padding: 10px 14px; min-height: 44px; cursor: pointer; }
#back:hover { border-color: var(--red); }
.panel-body { overflow-y: auto; padding: 22px 20px calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.panel h2 { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -.02em; line-height: 1.05; margin: 0; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 16px; }
.panel p strong { color: var(--fg); }
.pend { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #ffd3d8; background: rgba(255,35,56,.16); border: 1px dashed rgba(255,35,56,.6); padding: 2px 6px; vertical-align: middle; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row .l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row .l b { font-family: var(--display); font-weight: 700; font-size: 18px; }
.row .l span { font-size: 14px; color: var(--dim); }
.row .r { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; flex: 0 0 auto; }
.big { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.02em; color: var(--fg); font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--panel-2); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card b { font-family: var(--display); font-weight: 700; font-size: 17px; }
.card span { font-size: 14px; color: var(--muted); line-height: 1.45; }
.swatch { width: 18px; height: 18px; border-radius: 50%; }
.slot { aspect-ratio: 16 / 9; max-width: 100%; background: repeating-linear-gradient(45deg, #101318 0 10px, #0c0e12 10px 20px); border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; text-align: center; padding: 8px; }
.slot.sq { aspect-ratio: 1 / 1; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cta { align-self: flex-start; font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--red); padding: 13px 18px; text-decoration: none; }
.tabs { display: flex; gap: 6px; }
.tabs button { font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); padding: 10px 14px; min-height: 44px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: #fff; border-color: var(--red); }
.progress { height: 8px; background: var(--line); }
.progress i { display: block; height: 100%; background: var(--red); }
.copyline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copyline code { font-family: var(--mono); font-size: 16px; color: var(--fg); user-select: all; word-break: break-all; }
.copyline button { font-family: var(--mono); font-size: 12px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); padding: 8px 10px; cursor: pointer; }
.panel a.lk { color: var(--fg); text-decoration-color: var(--red); text-underline-offset: 3px; }
.note { font-family: var(--mono); font-size: 12px; color: var(--dim); letter-spacing: .04em; }

@media (max-width: 700px), (pointer: coarse) {
  .panel { top: auto; left: 0; width: 100%; height: 72%; border-left: 0; border-top: 2px solid var(--red); transform: translateY(105%); padding-top: 0; }
  .panel.open { transform: none; }
  .panel h2 { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .panel, #intro, #mira, #mira svg { transition: none; }
}
#nogl { display: none; position: fixed; inset: 0; z-index: 3; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 0 24px; font-family: var(--mono); font-size: 14px; }
</style>

      var p = rain.geometry.attributes.position.array;
      for (var i = 0; i < p.length; i += 6) { p[i + 1] -= dt * 14; p[i + 4] -= dt * 14; if (p[i + 4] < 0) { p[i + 1] = 11.4; p[i + 4] = 10.9; } }
      rain.geometry.attributes.position.needsUpdate = true;
      dust.rotation.y = t * .01;
      objects[0].group.children.forEach(function (c) { if (c.userData.spin) c.rotation.y = t * .6; });
      if (arcadeTick) arcadeTick(t);
    }
    if (!hintShown && activeIdx < 0 && performance.now() - lastAction > 6000 && introDone) showHint();
    renderer.render(scene, camera);
    drawMap();
    requestAnimationFrame(frame);
  }

  var introDone = false;
  function finishIntro() {
    introDone = true; lastAction = performance.now();
    document.getElementById("intro").classList.add("gone");
    try { localStorage.setItem("rainn-escondite-visto", "1"); } catch (e) {}
  }

  function init() {
    var bar = document.getElementById("intro-bar");
    if (gl) {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x040507);
      scene.fog = new THREE.Fog(0x040507, 16, 44);
      camera = new THREE.PerspectiveCamera(50, 1, .1, 120);
      raycaster = new THREE.Raycaster();
      clock = new THREE.Clock();
      scene.add(new THREE.AmbientLight(0x2a3444, .55));
      scene.add(new THREE.HemisphereLight(0x3a4a60, 0x0a0a0c, .35));
      bar.style.width = "30%";
      buildRoom(); bar.style.width = "60%";
      buildObjects(); buildAtmos(); bar.style.width = "100%";
      orbitPose(0, camState);
      resize();
      window.addEventListener("resize", resize);
      requestAnimationFrame(frame);
    } else { bar.style.width = "100%"; introDone = true; }
    var seen = false; try { seen = localStorage.getItem("rainn-escondite-visto") === "1"; } catch (e) {}
    if (isTouch) { document.getElementById("intro-sub").textContent = "Desliza para girar, apunta la mira y toca para abrir"; }
    setTimeout(function () {
      document.getElementById("intro-t").hidden = true; document.querySelector("#intro .bar").hidden = true;
      if (seen) { finishIntro(); return; }
      var ready = document.getElementById("intro-ready"); ready.hidden = false;
      document.getElementById("enter").addEventListener("click", finishIntro);
      setTimeout(finishIntro, 3500);
    }, 700);
  }
  init();
})();
</script>
