<style>
/* Layout: one object on a turntable in a pool of hard light; caption bottom-left, controls bottom-right. Single dark look. */
:root {
  --bg: #030405;
  --fg: #f1f1f1;
  --muted: #b3b8c2;
  --line: #262a32;
  --red: #ff2338;
  --display: "Inter Tight", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--mono); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
.cap { position: fixed; left: 0; bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.cap span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cap b { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: -.02em; }
.ctrl { position: fixed; right: 0; bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.ctrl button { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--fg); background: rgba(20,23,29,.85); border: 1px solid var(--line); padding: 10px 14px; min-height: 44px; cursor: pointer; }
.ctrl button[aria-pressed="true"] { border-color: var(--red); }
.ctrl button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.tip { position: fixed; top: 0; left: 0; right: 0; text-align: center; padding-top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
@media (max-width: 600px) { .cap b { font-size: 24px; } .ctrl { max-width: 100%; left: 0; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); bottom: 70px; } }
</style>

<script>
(function () {
  "use strict";

  var maxAniso = renderer.capabilities.getMaxAnisotropy();

  }
  function rnd(seed) { var s = seed || 1; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function px(x, c, X, Y, W, H) { x.fillStyle = c; x.fillRect(X, Y, W, H); }
  function Std(o) { return new THREE.MeshStandardMaterial(o); }

  /* soft environment for reflections: dark room with a few light panels */
  (function () {
    var env = new THREE.Scene();
    var box = new THREE.Mesh(new THREE.BoxGeometry(20, 12, 20), new THREE.MeshBasicMaterial({ color: 0x07090c, side: THREE.BackSide }));
    env.add(box);
    var panel = function (x, y, z, w, h, c, ry, rx) { var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); env.add(m); };
    panel(0, 5.9, 0, 3, 3, 0xe8f0ff, 0, Math.PI / 2);
    panel(-9.9, 3, 2, 4, 1.2, 0x5a6a80, Math.PI / 2);
    panel(9.9, 2.5, -3, 3, 1, 0x3a4a60, -Math.PI / 2);
    panel(0, 2, -9.9, 2, 1, 0x8a1020);
    panel(-4, 5.9, -3, .3, 6, 0xcfdcff, 0, Math.PI / 2); panel(4, 5.9, 3, .3, 6, 0xcfdcff, 0, Math.PI / 2);
    panel(-9.9, 4.5, -4, 6, .25, 0x9fb0cc, Math.PI / 2); panel(9.9, 4.5, 4, 6, .25, 0x9fb0cc, -Math.PI / 2); panel(3, 3, 9.9, 3, .4, 0x7a8aa6, Math.PI);
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, .04).texture;
  })();

  /* ---------- side art: painted, weathered ---------- */
  var prof = [[-.62, 0], [.62, 0], [.62, 1.22], [.86, 1.34], [.86, 1.46], [.5, 1.56], [.3, 2.36], [.52, 2.44], [.52, 2.86], [.44, 3.04], [-.62, 3.04]];
  var R = rnd(7);
  var sideTex = canvasTex(512, 1024, function (x, w, h) {
    var sx = function (v) { return (v + .62) / 1.5 * w; }, sy = function (v) { return h - v / 3.06 * h; };
    var g = x.createLinearGradient(0, 0, w * .3, h); g.addColorStop(0, "#16234a"); g.addColorStop(.55, "#0d1734"); g.addColorStop(1, "#070c1e"); x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (var i = 0; i < 900; i++) { x.fillStyle = "rgba(255,255,255," + (R() * .05) + ")"; x.fillRect(R() * w, R() * h, 1 + R() * 2, 1 + R() * 2); }
    // blue streak
    var gs = x.createLinearGradient(sx(-.62), 0, sx(.4), 0); gs.addColorStop(0, "rgba(58,123,213,.0)"); gs.addColorStop(1, "rgba(58,123,213,.85)");
    x.fillStyle = gs; x.beginPath(); x.moveTo(sx(-.62), sy(2.15)); x.lineTo(sx(.4), sy(2.62)); x.lineTo(sx(.4), sy(2.5)); x.lineTo(sx(-.62), sy(1.98)); x.fill();
    // crosshair, slightly worn
    var cx = sx(.02), cy = sy(.95); x.strokeStyle = "#d8172b"; x.lineCap = "butt";
    x.lineWidth = 9; x.beginPath(); x.arc(cx, cy, 118, 0, Math.PI * 2); x.stroke();
    x.lineWidth = 6; x.beginPath(); x.arc(cx, cy, 40, 0, Math.PI * 2); x.stroke();
    x.lineWidth = 8; [[0, -170, 0, -78], [0, 78, 0, 170], [-170, 0, -78, 0], [78, 0, 170, 0]].forEach(function (l) { x.beginPath(); x.moveTo(cx + l[0], cy + l[1]); x.lineTo(cx + l[2], cy + l[3]); x.stroke(); });
    x.fillStyle = "#d8172b"; x.beginPath(); x.arc(cx, cy, 6, 0, Math.PI * 2); x.fill();
    // wear: scratches and chipped paint
    for (var k = 0; k < 140; k++) { x.strokeStyle = "rgba(190,200,215," + (.05 + R() * .18) + ")"; x.lineWidth = .6 + R(); var a = R() * w, b = R() * h, l = 6 + R() * 40, ang = (R() - .5) * 1.2; x.beginPath(); x.moveTo(a, b); x.lineTo(a + Math.cos(ang) * l, b + Math.sin(ang) * l); x.stroke(); }
    for (var c = 0; c < 40; c++) { x.fillStyle = "rgba(10,12,16," + (.3 + R() * .4) + ")"; x.beginPath(); x.ellipse(R() * w, h - R() * 160, 2 + R() * 10, 1 + R() * 5, R() * 3, 0, Math.PI * 2); x.fill(); }
    // grime toward the floor
    var gr = x.createLinearGradient(0, h - 220, 0, h); gr.addColorStop(0, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(20,16,12,.65)"); x.fillStyle = gr; x.fillRect(0, h - 220, w, 220);
  });
  sideTex.wrapS = sideTex.wrapT = THREE.ClampToEdgeWrapping;
  sideTex.repeat.set(1 / 1.5, 1 / 3.06); sideTex.offset.set(.62 / 1.5, 0);
  var sideRough = canvasTex(256, 512, function (x, w, h) { px(x, "#9a9a9a", 0, 0, w, h); var r2 = rnd(3); for (var i = 0; i < 400; i++) { x.fillStyle = "rgba(" + (r2() > .5 ? "255,255,255" : "40,40,40") + "," + (r2() * .25) + ")"; x.fillRect(r2() * w, r2() * h, 1 + r2() * 3, 1 + r2() * 3); } }, { color: false });
  sideRough.repeat.copy(sideTex.repeat); sideRough.offset.copy(sideTex.offset);

  /* ---------- cabinet body ---------- */
  var shape = new THREE.Shape(); prof.forEach(function (p, i) { i ? shape.lineTo(p[0], p[1]) : shape.moveTo(p[0], p[1]); }); shape.closePath();
  var W = 1.34, bev = .025;
  var bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: W - bev * 2, bevelEnabled: true, bevelThickness: bev, bevelSize: bev, bevelSegments: 3, curveSegments: 4 });
  var sideMat = Std({ map: sideTex, roughnessMap: sideRough, roughness: .55, metalness: .05, envMapIntensity: .6 });
  var edgeMat = Std({ color: 0x0c1430, roughness: .62, metalness: .1, envMapIntensity: .35 });
  var body = new THREE.Mesh(bodyGeo, [sideMat, edgeMat]); body.position.z = -W / 2 + bev; body.castShadow = true; body.receiveShadow = true;

  var cab = new THREE.Group(); cab.add(body);
  function seg(a, b) { return { mid: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], len: Math.hypot(b[0] - a[0], b[1] - a[1]), ang: Math.atan2(b[1] - a[1], b[0] - a[0]) }; }
  function add(m) { m.castShadow = true; m.receiveShadow = true; cab.add(m); return m; }

  var black = Std({ color: 0x0b0b0d, roughness: .35, metalness: .2 });
  var tmold = Std({ color: 0xb30f20, roughness: .28, metalness: .1, emissive: 0x1a0204 });
  var steel = Std({ color: 0x7a8088, roughness: .32, metalness: .9 });
  var chrome = Std({ color: 0xd8dde3, roughness: .12, metalness: 1 });

  // rounded T-molding along both front edges
  for (var i = 1; i < prof.length - 1; i++) {
    var s = seg(prof[i], prof[i + 1]); if (s.len < .01) continue;
    [W / 2, -W / 2].forEach(function (z) {
      var m = new THREE.Mesh(new THREE.CylinderGeometry(.028, .028, s.len + .04, 10), tmold);
      m.position.set(s.mid[0], s.mid[1], z); m.rotation.z = s.ang - Math.PI / 2; add(m);
    });
  }

  // screen: pixel battle (the game itself stays pixel art) under glass
  var scr = canvasTex(160, 120, function () {}, { pixel: true });
  var sSeg = seg(prof[5], prof[6]);
  function onSlope(mesh, sg, lift) { mesh.position.set(sg.mid[0] + Math.cos(sg.ang - Math.PI / 2) * -lift * -1, sg.mid[1] + Math.sin(sg.ang - Math.PI / 2) * lift * -1, 0); }
  var bezel = new THREE.Mesh(new THREE.BoxGeometry(.03, sSeg.len * .96, W * .86), black);
  bezel.position.set(sSeg.mid[0] + .005, sSeg.mid[1], 0); bezel.rotation.z = sSeg.ang - Math.PI / 2; add(bezel);
  var screen = new THREE.Mesh(new THREE.PlaneGeometry(sSeg.len * .8, W * .7), new THREE.MeshBasicMaterial({ map: scr, toneMapped: false }));
  screen.position.set(sSeg.mid[0] + .045, sSeg.mid[1] + .011, 0); screen.rotation.set(0, Math.PI / 2, 0); screen.rotateX(-(sSeg.ang - Math.PI / 2)); cab.add(screen);
  var glass = new THREE.Mesh(new THREE.PlaneGeometry(sSeg.len * .84, W * .74), new THREE.MeshPhysicalMaterial({ color: 0x0a0d12, roughness: .05, metalness: 0, transparent: true, opacity: .07, clearcoat: 1, clearcoatRoughness: .05, envMapIntensity: 1.4 }));
  glass.position.copy(screen.position); glass.position.x += .015; glass.rotation.copy(screen.rotation); cab.add(glass);
  var glow = new THREE.PointLight(0x4a8cff, 1.6, 3.2, 2); glow.position.set(1.0, 1.95, 0); cab.add(glow);

  // marquee: backlit translucent panel
  var marq = canvasTex(512, 128, function (x, w, h) {
    var g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#140308"); g.addColorStop(.5, "#22060c"); g.addColorStop(1, "#140308"); x.fillStyle = g; x.fillRect(0, 0, w, h);
    x.font = "900 72px Impact, 'Arial Black', sans-serif"; x.textAlign = "center"; x.textBaseline = "middle";
    x.shadowColor = "rgba(255,35,56,.9)"; x.shadowBlur = 18; x.fillStyle = "#ff3347"; x.fillText("SALVAME", w / 2 - 84, h / 2 + 4);
    x.shadowColor = "rgba(255,255,255,.8)"; x.fillStyle = "#ffffff"; x.fillText("KIM!", w / 2 + 172, h / 2 + 4);
    x.shadowBlur = 0; px(x, "#ff2338", 0, 0, w, 5); px(x, "#ff2338", 0, h - 5, w, 5);
  });
  var mq = new THREE.Mesh(new THREE.PlaneGeometry(W * .88, .34), new THREE.MeshBasicMaterial({ map: marq, toneMapped: false, color: 0xffffff }));
  mq.position.set(.548, 2.65, 0); mq.rotation.y = Math.PI / 2; cab.add(mq);
  var mqFrame = new THREE.Mesh(new THREE.BoxGeometry(.04, .42, W * .94), steel); mqFrame.position.set(.5, 2.65, 0); add(mqFrame);
  var mqLight = new THREE.PointLight(0xff2a3c, 1.1, 2.6, 2); mqLight.position.set(1.0, 2.7, 0); cab.add(mqLight);

  // control panel
  var cSeg = seg(prof[4], prof[5]);
  var panel = new THREE.Group(); panel.position.set(cSeg.mid[0], cSeg.mid[1], 0); panel.rotation.z = cSeg.ang - Math.PI; cab.add(panel);
  var deck = new THREE.Mesh(new THREE.BoxGeometry(cSeg.len * .98, .012, W * .96), Std({ color: 0x060914, roughness: .28, metalness: .15, envMapIntensity: .8 })); deck.position.y = .008; deck.receiveShadow = true; panel.add(deck);
  var stick = new THREE.Mesh(new THREE.CylinderGeometry(.018, .018, .2, 12), chrome); stick.position.set(.02, .1, -.32); stick.castShadow = true; panel.add(stick);
  var ball = new THREE.Mesh(new THREE.SphereGeometry(.065, 24, 16), Std({ color: 0xc4111f, roughness: .18, metalness: 0 })); ball.position.set(.02, .22, -.32); ball.castShadow = true; panel.add(ball);
  var dust = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, .008, 20), black); dust.position.set(.02, .02, -.32); panel.add(dust);
  [[0xc4111f, -.02, .05], [0xc4111f, .06, .09], [0x2f6fd0, -.02, .22], [0xe9e9e9, .06, .26]].forEach(function (b) {
    var ring = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .012, 20), black); ring.position.set(b[1], .016, b[2]); panel.add(ring);
    var cap = new THREE.Mesh(new THREE.CylinderGeometry(.04, .042, .035, 20), Std({ color: b[0], roughness: .22, metalness: 0, emissive: b[0], emissiveIntensity: .08 })); cap.position.set(b[1], .035, b[2]); cap.castShadow = true; panel.add(cap);
  });

  // coin door, kick plate, speakers, back
  var door = add(new THREE.Mesh(new THREE.BoxGeometry(.02, .46, .52), steel)); door.position.set(.63, .78, 0);
  [-.1, .1].forEach(function (z) {
    var slot = new THREE.Mesh(new THREE.PlaneGeometry(.06, .11), new THREE.MeshBasicMaterial({ color: 0xff2338, toneMapped: false })); slot.position.set(.652, .87, z); slot.rotation.y = Math.PI / 2; cab.add(slot);
    var rim = add(new THREE.Mesh(new THREE.BoxGeometry(.012, .15, .1), chrome)); rim.position.set(.638, .87, z);
  });
  var ret = add(new THREE.Mesh(new THREE.BoxGeometry(.02, .07, .14), black)); ret.position.set(.642, .64, 0);
  var kick = add(new THREE.Mesh(new THREE.BoxGeometry(.04, .2, W), Std({ color: 0x0a0a0a, roughness: .7, metalness: .3 }))); kick.position.set(.62, .1, 0);
  [-.38, .38].forEach(function (z) { var sp = add(new THREE.Mesh(new THREE.CylinderGeometry(.075, .075, .02, 24), Std({ color: 0x111111, roughness: .9 }))); sp.position.set(.49, 2.41, z); sp.rotation.z = Math.PI / 2; });
  var vent = add(new THREE.Mesh(new THREE.BoxGeometry(.02, .5, .8), black)); vent.position.set(-.63, 2.4, 0);
  var cable = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(-.63, .3, .3), new THREE.Vector3(-.8, .03, .35), new THREE.Vector3(-1.4, .02, .6), new THREE.Vector3(-2.3, .02, .3)]), 30, .02, 6), black); cable.castShadow = true; cab.add(cable);

  cab.rotation.y = -Math.PI / 2;
  var turn = new THREE.Group(); turn.add(cab); scene.add(turn);

  /* ---------- wet concrete floor ---------- */
  var floorCol = canvasTex(1024, 1024, function (x, w, h) {
    px(x, "#3d4146", 0, 0, w, h); var r = rnd(11);
    for (var i = 0; i < 6000; i++) { var v = 45 + Math.floor(r() * 40); x.fillStyle = "rgba(" + v + "," + (v + 2) + "," + (v + 6) + "," + (.25 + r() * .35) + ")"; x.fillRect(r() * w, r() * h, 1 + r() * 4, 1 + r() * 4); }
    for (var j = 0; j < 30; j++) { x.fillStyle = "rgba(20,22,26," + (.1 + r() * .15) + ")"; x.beginPath(); x.ellipse(r() * w, r() * h, 30 + r() * 120, 20 + r() * 80, r() * 3, 0, Math.PI * 2); x.fill(); }
    x.strokeStyle = "rgba(15,16,18,.6)"; x.lineWidth = 2; x.beginPath(); x.moveTo(0, h / 2); x.lineTo(w, h / 2); x.moveTo(w / 2, 0); x.lineTo(w / 2, h); x.stroke();
  });
  floorCol.wrapS = floorCol.wrapT = THREE.RepeatWrapping; floorCol.repeat.set(6, 6);
  var floorRough = canvasTex(512, 512, function (x, w, h) {
    px(x, "#c8c8c8", 0, 0, w, h); var r = rnd(5);
    for (var j = 0; j < 22; j++) { var g = x.createRadialGradient(0, 0, 0, 0, 0, 1); var cx = r() * w, cy = r() * h, rad = 20 + r() * 70; g = x.createRadialGradient(cx, cy, 0, cx, cy, rad); g.addColorStop(0, "rgba(20,20,20,.95)"); g.addColorStop(1, "rgba(20,20,20,0)"); x.fillStyle = g; x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2); }
  }, { color: false });
  floorRough.wrapS = floorRough.wrapT = THREE.RepeatWrapping; floorRough.repeat.set(6, 6);
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), Std({ map: floorCol, roughnessMap: floorRough, roughness: 1, metalness: 0, envMapIntensity: .9 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  var puddle = new THREE.Mesh(new THREE.CircleGeometry(1, 40), Std({ color: 0x050607, roughness: .02, metalness: .0, envMapIntensity: 2.2 }));
  puddle.rotation.x = -Math.PI / 2; puddle.scale.set(1.1, .6, 1); puddle.position.set(1.5, .004, 1.3); puddle.receiveShadow = true; scene.add(puddle);

  /* ---------- light: one hard work lamp + faint fill ---------- */
  scene.add(new THREE.HemisphereLight(0x5a6c88, 0x050505, .18));
  var spot = new THREE.SpotLight(0xe6eeff, 17, 20, .38, .35, 1.6);
  spot.position.set(.3, 8.5, 1.2); spot.target.position.set(0, .8, 0);
  spot.castShadow = true; spot.shadow.mapSize.set(isPhone ? 1024 : 2048, isPhone ? 1024 : 2048); spot.shadow.bias = -.0002; spot.shadow.normalBias = .03; spot.shadow.radius = 3;
  scene.add(spot); scene.add(spot.target);
  var rim = new THREE.DirectionalLight(0x6f86b0, .35); rim.position.set(-4, 3, -5); scene.add(rim);
  // the lamp itself
  var lampHead = new THREE.Mesh(new THREE.CylinderGeometry(.18, .32, .3, 20, 1, true), steel); lampHead.position.set(.3, 8.6, 1.2); scene.add(lampHead);
  var bulb = new THREE.Mesh(new THREE.CircleGeometry(.3, 20), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })); bulb.rotation.x = Math.PI / 2; bulb.position.set(.3, 8.45, 1.2); scene.add(bulb);

  // volumetric beam (soft additive cone)
  var beamTex = canvasTex(64, 256, function (x, w, h) { var g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "rgba(255,255,255,.55)"); g.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = g; x.fillRect(0, 0, w, h); var gx = x.createLinearGradient(0, 0, w, 0); gx.addColorStop(0, "rgba(0,0,0,1)"); gx.addColorStop(.5, "rgba(0,0,0,0)"); gx.addColorStop(1, "rgba(0,0,0,1)"); x.globalCompositeOperation = "destination-out"; x.fillStyle = gx; x.fillRect(0, 0, w, h); });
  var beam = new THREE.Mesh(new THREE.CylinderGeometry(.25, 3.1, 8.4, 40, 1, true), new THREE.MeshBasicMaterial({ map: beamTex, color: 0x9fb4d8, transparent: true, opacity: .16, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
  beam.position.set(.2, 4.3, .9); scene.add(beam);

  // dust in the beam
  var N = 420, dp = new Float32Array(N * 3), r3 = rnd(9);
  for (var d = 0; d < N; d++) { var a = r3() * Math.PI * 2, rr = Math.sqrt(r3()) * 2.4, y = r3() * 7.5; dp.set([Math.cos(a) * rr * (y / 7.5 * .3 + .7), y, Math.sin(a) * rr], d * 3); }
  var dg = new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.BufferAttribute(dp, 3));
  var dustPts = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xcfd8e6, size: .025, transparent: true, opacity: .6, depthWrite: false })); scene.add(dustPts);

  /* ---------- pixel battle ---------- */
  var sprite = { hero: ["..WW..", ".WWWW.", "..SS..", ".WWWW.", "WWWWWW", ".WWWW.", ".G..G.", ".G..G."], boss: ["..KK..", ".KRRK.", "..RR..", "KKKKKK", "KKKKKK", ".KKKK.", ".K..K.", "KK..KK"] };
  var pal = { W: "#f1f1f1", S: "#c99a7a", G: "#9aa0a6", K: "#141414", R: "#d4152a" };
  function drawSprite(x, s, ox, oy, k) { s.forEach(function (row, r) { for (var c = 0; c < row.length; c++) { var ch = row[c]; if (ch !== ".") px(x, pal[ch], ox + c * k, oy + r * k, k, k); } }); }
  function drawScreen(t) {
    var x = scr.userData.ctx, w = 160, h = 120;
    px(x, "#0c1a3a", 0, 0, w, h); px(x, "#13284f", 0, 0, w, 44);
    for (var i = 0; i < 6; i++) px(x, "#1d3a6a", 12 + i * 26, 16, 12, 28);
    px(x, "#3a2a1e", 0, 80, w, 40); px(x, "#4a3626", 0, 80, w, 4);
    var f = Math.floor(t * 8) % 2;
    drawSprite(x, sprite.boss, 100, 36 + f * 2, 6);
    for (var q = 0; q < 4; q++) px(x, f ? "#ff8a1e" : "#ffcf3a", 96 + q * 12, 82 - ((q + f) % 2) * 4, 4, 6);
    var lunge = (t % 2.4) > 2 ? 12 : 0;
    drawSprite(x, sprite.hero, 24 + lunge, 48, 6);
    px(x, "#e8e3d6", 4, 4, 68, 14); px(x, "#2a2a2a", 8, 10, 60, 4); px(x, "#3fbf5f", 8, 10, 16 + Math.round(20 + 20 * Math.sin(t * .7)), 4);
    px(x, "#e8e3d6", 88, 102, 68, 14); px(x, "#2a2a2a", 92, 108, 60, 4); px(x, "#3fbf5f", 92, 108, 36, 4);
    if ((t % 2.4) > 2.05 && (t % 2.4) < 2.2) { x.fillStyle = "rgba(255,255,255,.55)"; x.fillRect(0, 0, w, h); }
    for (var y = 0; y < h; y += 2) px(x, "rgba(0,0,0,.2)", 0, y, w, 1);
    scr.needsUpdate = true;
  }
  drawScreen(0);


  /* ---------- glossy finish on everything (clearcoat + lower roughness) ---------- */
  (function glossify() {
    var cache = new Map();
    function conv(m) {
      if (!m || !m.isMeshStandardMaterial || m.transparent) return m;
      if (cache.has(m)) return cache.get(m);
      var p = m.isMeshPhysicalMaterial ? m : new THREE.MeshPhysicalMaterial();
      if (p !== m) { THREE.MeshStandardMaterial.prototype.copy.call(p, m); p.defines = { STANDARD: "", PHYSICAL: "" }; }
      var matte = m.roughness >= .88;
      p.roughness = matte ? Math.max(.35, m.roughness * .6) : Math.max(.05, m.roughness * .4);
      p.clearcoat = matte ? .35 : 1; p.clearcoatRoughness = matte ? .3 : .06;
      p.envMapIntensity = (m.envMapIntensity || 1) * 1.5;
      p.needsUpdate = true; cache.set(m, p); return p;
    }
    scene.traverse(function (o) { if (!o.isMesh) return; o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material); });
  })();

  /* ---------- post: bloom + grain/vignette ---------- */
  var composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), .55, .5, .82); composer.addPass(bloom);
  var grade = new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;" +
      "float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime) * 43758.5453); }" +
      "void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - .5; float v = smoothstep(.85, .25, length(d)); c.rgb *= mix(.45, 1.0, v); c.rgb += (h(vUv * 800.0) - .5) * .035; c.rgb = mix(c.rgb, c.rgb * vec3(.92,.97,1.06), .5); gl_FragColor = c; }"
  });
  composer.addPass(grade);

  /* ---------- controls ---------- */
  var rotY = .55, vel = 0, drag = null, camT = 0;
  canvas.addEventListener("pointerdown", function (e) { drag = { x: e.clientX, r: rotY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", function (e) { if (!drag) return; var n = drag.r + (e.clientX - drag.x) * .012; vel = n - rotY; rotY = n; });
  canvas.addEventListener("pointerup", function () { drag = null; });
  window.addEventListener("keydown", function (e) { if (e.key === "ArrowLeft") rotY -= .2; if (e.key === "ArrowRight") rotY += .2; });
  document.getElementById("b-spin").addEventListener("click", function () { spin = !spin; this.setAttribute("aria-pressed", spin); });
  document.getElementById("b-close").addEventListener("click", function () { close = !close; this.setAttribute("aria-pressed", close); });

  var portrait = false;
  function resize() {
    var w = innerWidth, h = innerHeight; portrait = w < h;
    var pr = Math.min(devicePixelRatio || 1, isPhone ? 1.5 : 2);
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    composer.setPixelRatio(pr); composer.setSize(w, h);
    bloom.resolution.set(w / 2, h / 2);
    camera.aspect = w / h; camera.fov = portrait ? 50 : 34; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  var clock = new THREE.Clock();
  var far = new THREE.Vector3(), near = new THREE.Vector3();
  function frame() {
    var dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    if (!drag) { if (spin) rotY += dt * .3; rotY += vel; vel *= .9; }
    turn.rotation.y = rotY;
    camT += ((close ? 1 : 0) - camT) * Math.min(1, dt * 3);
    far.set(0, 2.6, portrait ? 8.6 : 7.4); near.set(.35, 2.15, portrait ? 3.6 : 3.1);
    camera.position.lerpVectors(far, near, camT);
    camera.lookAt(0, 1.45 + camT * .45, 0);
    if (!reduce) { drawScreen(t); dustPts.rotation.y = t * .02; dustPts.position.y = Math.sin(t * .3) * .05; }
    glow.intensity = 1.5 + Math.sin(t * 12) * .12;
    grade.uniforms.uTime.value = t % 10;
    composer.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
