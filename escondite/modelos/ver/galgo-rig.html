<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galgo articulado — vista previa</title>
<style>html,body{margin:0;height:100%;background:#07080a;overflow:hidden}canvas{display:block;width:100%;height:100%}</style>
</head><body><canvas id="c"></canvas>
<script src="../../vendor/three.min.js"></script>
<script src="../../vendor/GLTFLoader.js"></script>
<script src="../../parts/galgo-rig.js"></script>
<script>
// ?yaw=deg&t=sec&still=1  (t freezes the walk phase for screenshots; still=1 shows the bind pose)
var q = new URLSearchParams(location.search), FIX = q.has("t") ? +q.get("t") : null;
var r = new THREE.WebGLRenderer({ canvas: document.getElementById("c"), antialias: true }); r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping;
var s = new THREE.Scene(); s.background = new THREE.Color(0x0b0d11);
var cam = new THREE.PerspectiveCamera(30, 1, .05, 50);
s.add(new THREE.HemisphereLight(0xb0c0dc, 0x202020, .9)); var key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 4, 3); s.add(key);
var floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x3a3e44, roughness: .9 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -.37; s.add(floor);
function size() { r.setPixelRatio(1); r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
size();
var dog = null, yaw = (+q.get("yaw") || 90) * Math.PI / 180;
new THREE.GLTFLoader().load("../../galgos/galgo-pie.glb", function (gl) {
  var mesh; gl.scene.traverse(function (o) { if (o.isMesh) mesh = o; });
  dog = rigGalgo(mesh); s.add(dog.root);
  if (!q.get("still")) { if (FIX !== null) { var G = q.get('gait') === 'run' ? { walk: 0, run: 1 } : { walk: 1, run: 0 }; for (var i = 0; i < 180; i++) dog.tick(i / 60, G, 1 / 60); dog.tick(3, G, FIX); } }
  cam.position.set(Math.sin(yaw) * 2.4, .25, Math.cos(yaw) * 2.4); cam.lookAt(0, 0, 0);
  r.render(s, cam); window.done = 1;
}, undefined, function (e) { window.err = String(e); window.done = 1; });
</script></body></html>
