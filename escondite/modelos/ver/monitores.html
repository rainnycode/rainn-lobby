<style>
/* Layout: one object on a turntable in a pool of hard light; caption bottom-left, controls bottom-right. Single dark look. */
:root {
  --bg: #030405;
  --fg: #f1f1f1;
  --muted: #b3b8c2;
  --line: #262a32;
  --red: #ff2338;
  --display: "Inter Tight", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--mono); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
.cap { position: fixed; left: 0; bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.cap span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cap b { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: -.02em; }
.ctrl { position: fixed; right: 0; bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
.ctrl button { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--fg); background: rgba(20,23,29,.85); border: 1px solid var(--line); padding: 10px 14px; min-height: 44px; cursor: pointer; }
.ctrl button[aria-pressed="true"] { border-color: var(--red); }
.ctrl button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.tip { position: fixed; top: 0; left: 0; right: 0; text-align: center; padding-top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
@media (max-width: 600px) { .cap b { font-size: 24px; } .ctrl { max-width: 100%; left: 0; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); bottom: 70px; } }
</style>

<canvas id="c" aria-label="Modelo 3D de la estación de monitores con radar girando"></canvas>
<div class="tip">Arrastra para girar</div>
<div class="cap"><span>Modelo 5 de 11 · gráficos modernos</span><b>Monitores · Los números</b></div>
<div class="ctrl">
  <button type="button" id="b-spin" aria-pressed="true">Girar solo</button>
  <button type="button" id="b-close" aria-pressed="false">Ver de cerca</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030405);
  scene.fog = new THREE.FogExp2(0x030405, .075);
  var camera = new THREE.PerspectiveCamera(34, 1, .05, 80);
  var spin = true, close = false;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { spin = false; document.getElementById("b-spin").setAttribute("aria-pressed", "false"); }
  var isPhone = matchMedia("(pointer: coarse)").matches;
  var maxAniso = renderer.capabilities.getMaxAnisotropy();

  /* ---------- helpers ---------- */
  function canvasTex(w, h, draw, opts) {
    opts = opts || {};
    var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    var x = cv.getContext("2d"); draw(x, w, h);
    var t = new THREE.CanvasTexture(cv);
    if (opts.pixel) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; }
    else t.anisotropy = maxAniso;
    if (opts.color !== false) t.encoding = THREE.sRGBEncoding;
    t.userData = { ctx: x };
    return t;
  }
  function rnd(seed) { var s = seed || 1; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
  function px(x, c, X, Y, W, H) { x.fillStyle = c; x.fillRect(X, Y, W, H); }
  function Std(o) { return new THREE.MeshStandardMaterial(o); }

  /* soft environment for reflections: dark room with a few light panels */
  (function () {
    var env = new THREE.Scene();
    var box = new THREE.Mesh(new THREE.BoxGeometry(20, 12, 20), new THREE.MeshBasicMaterial({ color: 0x07090c, side: THREE.BackSide }));
    env.add(box);
    var panel = function (x, y, z, w, h, c, ry, rx) { var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); env.add(m); };
    panel(0, 5.9, 0, 3, 3, 0xe8f0ff, 0, Math.PI / 2);
    panel(-9.9, 3, 2, 4, 1.2, 0x5a6a80, Math.PI / 2);
    panel(9.9, 2.5, -3, 3, 1, 0x3a4a60, -Math.PI / 2);
    panel(0, 2, -9.9, 2, 1, 0x8a1020);
    panel(-4, 5.9, -3, .3, 6, 0xcfdcff, 0, Math.PI / 2); panel(4, 5.9, 3, .3, 6, 0xcfdcff, 0, Math.PI / 2);
    panel(-9.9, 4.5, -4, 6, .25, 0x9fb0cc, Math.PI / 2); panel(9.9, 4.5, 4, 6, .25, 0x9fb0cc, -Math.PI / 2); panel(3, 3, 9.9, 3, .4, 0x7a8aa6, Math.PI);
    var pm = new THREE.PMREMGenerator(renderer);
    scene.environment = pm.fromScene(env, .04).texture;
  })();

  /* ---------- surveillance station (the numbers) ---------- */
  var sta = new THREE.Group();
  function add(m, parent) { m.castShadow = true; m.receiveShadow = true; (parent || sta).add(m); return m; }
  var chrome = Std({ color: 0xdfe3e8, roughness: .12, metalness: 1 });
  var steel = Std({ color: 0x7a8088, roughness: .32, metalness: .9 });
  var black = Std({ color: 0x0b0b0d, roughness: .4, metalness: .2 });
  var rubber = Std({ color: 0x151515, roughness: .85 });

  // grated mezzanine floor piece + railing behind
  var grate = canvasTex(128, 128, function (x, w, h) { px(x, "#1a1c1f", 0, 0, w, h); x.fillStyle = "#3a3e44"; for (var i = 0; i < w; i += 8) { x.fillRect(i, 0, 2, h); x.fillRect(0, i, w, 2); } }, {});
  grate.wrapS = grate.wrapT = THREE.RepeatWrapping; grate.repeat.set(6, 4);
  var deck = add(new THREE.Mesh(new THREE.BoxGeometry(3.6, .06, 2.4), Std({ map: grate, roughness: .5, metalness: .7 }))); deck.position.set(0, .03, -.2);
  [-1.75, -.6, .6, 1.75].forEach(function (x) { add(new THREE.Mesh(new THREE.BoxGeometry(.05, 1.05, .05), steel)).position.set(x, .55, -1.35); });
  add(new THREE.Mesh(new THREE.BoxGeometry(3.6, .05, .05), steel)).position.set(0, 1.07, -1.35);
  add(new THREE.Mesh(new THREE.BoxGeometry(3.6, .035, .035), steel)).position.set(0, .6, -1.35);

  // olive military crates
  var crateTex = canvasTex(256, 256, function (x, w, h) {
    var r = rnd(17); px(x, "#3f4a2e", 0, 0, w, h);
    for (var i = 0; i < 900; i++) { x.fillStyle = "rgba(" + (r() > .5 ? "90,100,70" : "20,24,14") + "," + r() * .25 + ")"; x.fillRect(r() * w, r() * h, 1 + r() * 3, 1); }
    x.strokeStyle = "rgba(15,18,10,.8)"; x.lineWidth = 6; x.strokeRect(6, 6, w - 12, h - 12);
    x.fillStyle = "rgba(225,215,170,.75)"; x.font = "700 26px 'Courier New', monospace"; x.fillText("1080-CMD", 30, 120); x.font = "700 18px 'Courier New', monospace"; x.fillText("LOT 07/23", 30, 150);
  });
  var crate = Std({ map: crateTex, roughness: .75, metalness: .1 });
  var c1 = add(new THREE.Mesh(new THREE.BoxGeometry(2.4, .62, .8), crate)); c1.position.set(0, .37, -.55);
  [-1.15, 1.15].forEach(function (x) { add(new THREE.Mesh(new THREE.BoxGeometry(.08, .08, .4), steel)).position.set(x, .5, -.55); });

  // CRT monitor factory
  var screens = [];
  function monitor(x, y, z, ry, w, h, d) {
    var g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry || 0; sta.add(g);
    var shellM = Std({ color: 0x2a2c2f, roughness: .55 });
    var front = add(new THREE.Mesh(new THREE.BoxGeometry(w, h, .08), shellM), g);
    var bgeo = new THREE.BoxGeometry(w * .95, h * .92, d), bp = bgeo.attributes.position;
    for (var i = 0; i < bp.count; i++) if (bp.getZ(i) < 0) { bp.setX(i, bp.getX(i) * .6); bp.setY(i, bp.getY(i) * .65 + .02); }
    bgeo.computeVertexNormals(); var back = add(new THREE.Mesh(bgeo, shellM), g); back.position.z = -d / 2 - .04;
    var cv = canvasTex(192, 144, function () {}, { pixel: true });
    var sgeo = new THREE.PlaneGeometry(w * .8, h * .76, 12, 10), sp = sgeo.attributes.position;
    for (var k = 0; k < sp.count; k++) { var X = sp.getX(k), Y = sp.getY(k); sp.setZ(k, .03 - (X * X + Y * Y) * .2); }
    var sc = new THREE.Mesh(sgeo, new THREE.MeshBasicMaterial({ map: cv, toneMapped: false })); sc.position.set(0, .01, .03); g.add(sc);
    var gl = new THREE.Mesh(sgeo.clone(), new THREE.MeshPhysicalMaterial({ color: 0x061014, roughness: .03, transparent: true, opacity: .14, clearcoat: 1, envMapIntensity: 1.5, depthWrite: false })); gl.position.set(0, .01, .04); g.add(gl);
    var ledM = new THREE.Mesh(new THREE.CircleGeometry(.01, 8), new THREE.MeshBasicMaterial({ color: 0x3fff7a, toneMapped: false })); ledM.position.set(w / 2 - .06, -h / 2 + .04, .041); g.add(ledM);
    screens.push(cv); return g;
  }
  monitor(-.78, .98, -.5, .18, .72, .56, .5);
  monitor(0, .98, -.55, 0, .72, .56, .5);
  monitor(.78, .98, -.5, -.18, .72, .56, .5);
  monitor(-.38, 1.55, -.6, .08, .62, .48, .42);
  monitor(.4, 1.55, -.6, -.08, .62, .48, .42);
  var cyan = new THREE.PointLight(0x2bd6e8, 1.6, 3.2, 2); cyan.position.set(0, 1.2, .5); sta.add(cyan);

  // keyboard, mug, folding chair, cables
  var kb = add(new THREE.Mesh(new THREE.BoxGeometry(.6, .03, .2), Std({ color: 0x2a2c2f, roughness: .6 }))); kb.position.set(-.1, .695, -.08); kb.rotation.y = .05;
  for (var r0 = 0; r0 < 4; r0++) for (var k0 = 0; k0 < 12; k0++) { var key = new THREE.Mesh(new THREE.BoxGeometry(.035, .012, .035), Std({ color: 0x3a3d42, roughness: .5 })); key.position.set(-.1 - .26 + k0 * .046, .715, -.08 - .06 + r0 * .042); key.rotation.y = .05; sta.add(key); }
  var mug = add(new THREE.Mesh(new THREE.CylinderGeometry(.045, .04, .1, 20), Std({ color: 0xe8e4da, roughness: .4 }))); mug.position.set(.62, .73, -.15);
  var handle = add(new THREE.Mesh(new THREE.TorusGeometry(.03, .008, 8, 16, Math.PI), Std({ color: 0xe8e4da, roughness: .4 }))); handle.position.set(.67, .73, -.15); handle.rotation.z = -Math.PI / 2;
  var chair = new THREE.Group(); chair.position.set(.25, .06, .75); chair.rotation.y = .4; sta.add(chair);
  var seatM = Std({ color: 0x20232a, roughness: .5, metalness: .5 });
  add(new THREE.Mesh(new THREE.BoxGeometry(.42, .03, .4), seatM), chair).position.y = .44;
  add(new THREE.Mesh(new THREE.BoxGeometry(.42, .32, .03), seatM), chair).position.set(0, .74, .2);
  [[-.19, -.18, .2], [.19, -.18, .2], [-.19, .2, -.2], [.19, .2, -.2]].forEach(function (l) { var leg = add(new THREE.Mesh(new THREE.CylinderGeometry(.012, .012, .62, 8), steel), chair); leg.position.set(l[0], .3, l[1] * .9); leg.rotation.x = l[2]; });
  add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(-.6, .95, -.85), new THREE.Vector3(-.9, .5, -.95), new THREE.Vector3(-1.1, .08, -.6), new THREE.Vector3(-1.4, .07, .4), new THREE.Vector3(-1.6, .07, 1.0)]), 40, .015, 6), rubber));
  add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(.6, .95, -.85), new THREE.Vector3(.9, .4, -1.0), new THREE.Vector3(1.2, .08, -.7), new THREE.Vector3(1.7, .07, -.9)]), 40, .015, 6), rubber));

  sta.position.set(0, 0, .1);
  var turn = new THREE.Group(); turn.add(sta); scene.add(turn);

  /* screens: radar + the five numbers */
  var nums = [["1.2M", "VISTAS IG", "90 DÍAS"], ["1.4M", "VISTAS", "1 TIKTOK"], ["61.3K", "STREAMS", "+299%"], ["14.1K", "OYENTES", "+313%"], ["10.2K", "SEGUIDORES", "TIKTOK"]];
  var blips = [[.3, .2], [-.4, .5], [.55, -.3], [-.2, -.6]];
  function drawRadar(x, w, h, t) {
    px(x, "#021013", 0, 0, w, h); var cx = w / 2, cy = h / 2, R0 = 62;
    x.strokeStyle = "rgba(43,214,232,.35)"; x.lineWidth = 1;
    for (var r = 1; r <= 3; r++) { x.beginPath(); x.arc(cx, cy, R0 * r / 3, 0, Math.PI * 2); x.stroke(); }
    x.beginPath(); x.moveTo(cx - R0, cy); x.lineTo(cx + R0, cy); x.moveTo(cx, cy - R0); x.lineTo(cx, cy + R0); x.stroke();
    var a = t * 1.6 % (Math.PI * 2);
    for (var s = 0; s < 18; s++) { x.strokeStyle = "rgba(43,214,232," + (.5 - s * .027) + ")"; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a - s * .05) * R0, cy + Math.sin(a - s * .05) * R0); x.stroke(); }
    blips.forEach(function (b, i) { var ba = Math.atan2(b[1], b[0]), age = ((a - ba) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2); x.fillStyle = i === 0 ? "rgba(255,35,56," + Math.max(.25, 1 - age / 4) + ")" : "rgba(43,214,232," + Math.max(.15, 1 - age / 4) + ")"; x.beginPath(); x.arc(cx + b[0] * R0, cy + b[1] * R0, i === 0 ? 4 : 3, 0, Math.PI * 2); x.fill(); });
    x.fillStyle = "#2bd6e8"; x.font = "bold 11px monospace"; x.fillText("SCAN · 1080", 8, 14);
  }
  function drawNum(x, w, h, t, n, i) {
    px(x, "#021013", 0, 0, w, h);
    x.fillStyle = "rgba(43,214,232,.18)"; for (var b = 0; b < 12; b++) { var bh = 10 + Math.abs(Math.sin(b * .9 + i)) * 30 + (b === 11 ? 12 : 0); x.fillRect(10 + b * 14, h - 14 - bh, 9, bh); }
    x.fillStyle = "#2bd6e8"; x.font = "bold 44px monospace"; x.textAlign = "center"; x.fillText(n[0], w / 2, 66);
    x.font = "bold 14px monospace"; x.fillText(n[1], w / 2, 88); x.fillStyle = n[2].charAt(0) === "+" ? "#ff4757" : "rgba(43,214,232,.7)"; x.fillText(n[2], w / 2, 106); x.textAlign = "left";
    if (Math.floor(t * 2 + i) % 2) { x.fillStyle = "#2bd6e8"; x.fillRect(w - 16, 8, 8, 12); }
  }
  var lastDraw = -1;
  function monTick(t) {
    if (t - lastDraw < .08 && t > 0) return; lastDraw = t;
    var page = Math.floor(t / 3) % nums.length;
    screens.forEach(function (cv, i) {
      var x = cv.userData.ctx, w = 192, h = 144;
      if (i === 1) drawRadar(x, w, h, t); else { var k = (i + page) % nums.length; drawNum(x, w, h, t, nums[k], i); }
      for (var y = 0; y < h; y += 3) { x.fillStyle = "rgba(0,0,0,.25)"; x.fillRect(0, y, w, 1); }
      cv.needsUpdate = true;
    });
    cyan.intensity = 1.5 + Math.sin(t * 9) * .08;
  }

  /* ---------- wet concrete floor ---------- */
  var floorCol = canvasTex(1024, 1024, function (x, w, h) {
    px(x, "#3d4146", 0, 0, w, h); var r = rnd(11);
    for (var i = 0; i < 6000; i++) { var v = 45 + Math.floor(r() * 40); x.fillStyle = "rgba(" + v + "," + (v + 2) + "," + (v + 6) + "," + (.25 + r() * .35) + ")"; x.fillRect(r() * w, r() * h, 1 + r() * 4, 1 + r() * 4); }
    for (var j = 0; j < 30; j++) { x.fillStyle = "rgba(20,22,26," + (.1 + r() * .15) + ")"; x.beginPath(); x.ellipse(r() * w, r() * h, 30 + r() * 120, 20 + r() * 80, r() * 3, 0, Math.PI * 2); x.fill(); }
    x.strokeStyle = "rgba(15,16,18,.6)"; x.lineWidth = 2; x.beginPath(); x.moveTo(0, h / 2); x.lineTo(w, h / 2); x.moveTo(w / 2, 0); x.lineTo(w / 2, h); x.stroke();
  });
  floorCol.wrapS = floorCol.wrapT = THREE.RepeatWrapping; floorCol.repeat.set(6, 6);
  var floorRough = canvasTex(512, 512, function (x, w, h) {
    px(x, "#c8c8c8", 0, 0, w, h); var r = rnd(5);
    for (var j = 0; j < 22; j++) { var g = x.createRadialGradient(0, 0, 0, 0, 0, 1); var cx = r() * w, cy = r() * h, rad = 20 + r() * 70; g = x.createRadialGradient(cx, cy, 0, cx, cy, rad); g.addColorStop(0, "rgba(20,20,20,.95)"); g.addColorStop(1, "rgba(20,20,20,0)"); x.fillStyle = g; x.fillRect(cx - rad, cy - rad, rad * 2, rad * 2); }
  }, { color: false });
  floorRough.wrapS = floorRough.wrapT = THREE.RepeatWrapping; floorRough.repeat.set(6, 6);
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(36, 36), Std({ map: floorCol, roughnessMap: floorRough, roughness: 1, metalness: 0, envMapIntensity: .9 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  var puddle = new THREE.Mesh(new THREE.CircleGeometry(1, 40), Std({ color: 0x050607, roughness: .02, metalness: .0, envMapIntensity: 2.2 }));
  puddle.rotation.x = -Math.PI / 2; puddle.scale.set(1.1, .6, 1); puddle.position.set(1.5, .004, 1.3); puddle.receiveShadow = true; scene.add(puddle);

  /* ---------- light: one hard work lamp + faint fill ---------- */
  scene.add(new THREE.HemisphereLight(0x5a6c88, 0x050505, .18));
  var spot = new THREE.SpotLight(0xe6eeff, 17, 20, .38, .35, 1.6);
  spot.position.set(.3, 8.5, 1.2); spot.target.position.set(0, .8, 0);
  spot.castShadow = true; spot.shadow.mapSize.set(isPhone ? 1024 : 2048, isPhone ? 1024 : 2048); spot.shadow.bias = -.0002; spot.shadow.normalBias = .03; spot.shadow.radius = 3;
  scene.add(spot); scene.add(spot.target);
  var rim = new THREE.DirectionalLight(0x6f86b0, .35); rim.position.set(-4, 3, -5); scene.add(rim);
  // the lamp itself
  var lampHead = new THREE.Mesh(new THREE.CylinderGeometry(.18, .32, .3, 20, 1, true), steel); lampHead.position.set(.3, 8.6, 1.2); scene.add(lampHead);
  var bulb = new THREE.Mesh(new THREE.CircleGeometry(.3, 20), new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })); bulb.rotation.x = Math.PI / 2; bulb.position.set(.3, 8.45, 1.2); scene.add(bulb);

  // volumetric beam (soft additive cone)
  var beamTex = canvasTex(64, 256, function (x, w, h) { var g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "rgba(255,255,255,.55)"); g.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = g; x.fillRect(0, 0, w, h); var gx = x.createLinearGradient(0, 0, w, 0); gx.addColorStop(0, "rgba(0,0,0,1)"); gx.addColorStop(.5, "rgba(0,0,0,0)"); gx.addColorStop(1, "rgba(0,0,0,1)"); x.globalCompositeOperation = "destination-out"; x.fillStyle = gx; x.fillRect(0, 0, w, h); });
  var beam = new THREE.Mesh(new THREE.CylinderGeometry(.25, 3.1, 8.4, 40, 1, true), new THREE.MeshBasicMaterial({ map: beamTex, color: 0x9fb4d8, transparent: true, opacity: .16, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
  beam.position.set(.2, 4.3, .9); scene.add(beam);

  // dust in the beam
  var N = 420, dp = new Float32Array(N * 3), r3 = rnd(9);
  for (var d = 0; d < N; d++) { var a = r3() * Math.PI * 2, rr = Math.sqrt(r3()) * 2.4, y = r3() * 7.5; dp.set([Math.cos(a) * rr * (y / 7.5 * .3 + .7), y, Math.sin(a) * rr], d * 3); }
  var dg = new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.BufferAttribute(dp, 3));
  var dustPts = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xcfd8e6, size: .025, transparent: true, opacity: .6, depthWrite: false })); scene.add(dustPts);


  /* ---------- glossy finish on everything (clearcoat + lower roughness) ---------- */
  (function glossify() {
    var cache = new Map();
    function conv(m) {
      if (!m || !m.isMeshStandardMaterial || m.transparent) return m;
      if (cache.has(m)) return cache.get(m);
      var p = m.isMeshPhysicalMaterial ? m : new THREE.MeshPhysicalMaterial();
      if (p !== m) { THREE.MeshStandardMaterial.prototype.copy.call(p, m); p.defines = { STANDARD: "", PHYSICAL: "" }; }
      var matte = m.roughness >= .88;
      p.roughness = matte ? Math.max(.35, m.roughness * .6) : Math.max(.05, m.roughness * .4);
      p.clearcoat = matte ? .35 : 1; p.clearcoatRoughness = matte ? .3 : .06;
      p.envMapIntensity = (m.envMapIntensity || 1) * 1.5;
      p.needsUpdate = true; cache.set(m, p); return p;
    }
    scene.traverse(function (o) { if (!o.isMesh) return; o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material); });
  })();

  /* ---------- post: bloom + grain/vignette ---------- */
  var composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), .55, .5, .82); composer.addPass(bloom);
  var grade = new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;" +
      "float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime) * 43758.5453); }" +
      "void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - .5; float v = smoothstep(.85, .25, length(d)); c.rgb *= mix(.45, 1.0, v); c.rgb += (h(vUv * 800.0) - .5) * .035; c.rgb = mix(c.rgb, c.rgb * vec3(.92,.97,1.06), .5); gl_FragColor = c; }"
  });
  composer.addPass(grade);

  /* ---------- controls ---------- */
  var rotY = .55, vel = 0, drag = null, camT = 0;
  canvas.addEventListener("pointerdown", function (e) { drag = { x: e.clientX, r: rotY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", function (e) { if (!drag) return; var n = drag.r + (e.clientX - drag.x) * .012; vel = n - rotY; rotY = n; });
  canvas.addEventListener("pointerup", function () { drag = null; });
  window.addEventListener("keydown", function (e) { if (e.key === "ArrowLeft") rotY -= .2; if (e.key === "ArrowRight") rotY += .2; });
  document.getElementById("b-spin").addEventListener("click", function () { spin = !spin; this.setAttribute("aria-pressed", spin); });
  document.getElementById("b-close").addEventListener("click", function () { close = !close; this.setAttribute("aria-pressed", close); });

  var portrait = false;
  function resize() {
    var w = innerWidth, h = innerHeight; portrait = w < h;
    var pr = Math.min(devicePixelRatio || 1, isPhone ? 1.5 : 2);
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    composer.setPixelRatio(pr); composer.setSize(w, h);
    bloom.resolution.set(w / 2, h / 2);
    camera.aspect = w / h; camera.fov = portrait ? 50 : 34; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  var clock = new THREE.Clock();
  var far = new THREE.Vector3(), near = new THREE.Vector3();
  function frame() {
    var dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    if (!drag) { if (spin) rotY += dt * .3; rotY += vel; vel *= .9; }
    turn.rotation.y = rotY;
    camT += ((close ? 1 : 0) - camT) * Math.min(1, dt * 3);
    far.set(0, 2.6, portrait ? 8.6 : 7.4); near.set(.35, 2.15, portrait ? 3.6 : 3.1);
    camera.position.lerpVectors(far, near, camT);
    camera.lookAt(0, 1.45 + camT * .45, 0);
    monTick(reduce ? 0 : t);
    if (!reduce) { dustPts.rotation.y = t * .02; dustPts.position.y = Math.sin(t * .3) * .05; }
    grade.uniforms.uTime.value = t % 10;
    composer.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
