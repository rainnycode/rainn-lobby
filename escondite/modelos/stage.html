  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); overflow: hidden; font-family: var(--mono); }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c:active { cursor: grabbing; }
.cap { position: fixed; left: 0; bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.cap span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.cap b { font-family: var(--display); font-weight: 800; font-size: 32px; letter-spacing: -.02em; }
.ctrl { position: fixed; right: 0; bottom: 0; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }

.ctrl button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.tip { position: fixed; top: 0; left: 0; right: 0; text-align: center; padding-top: calc(16px + env(safe-area-inset-top, 0px)); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); pointer-events: none; }

</style>

  var beamTex = canvasTex(64, 256, function (x, w, h) { var g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "rgba(255,255,255,.55)"); g.addColorStop(1, "rgba(255,255,255,0)"); x.fillStyle = g; x.fillRect(0, 0, w, h); var gx = x.createLinearGradient(0, 0, w, 0); gx.addColorStop(0, "rgba(0,0,0,1)"); gx.addColorStop(.5, "rgba(0,0,0,0)"); gx.addColorStop(1, "rgba(0,0,0,1)"); x.globalCompositeOperation = "destination-out"; x.fillStyle = gx; x.fillRect(0, 0, w, h); });
  var beam = new THREE.Mesh(new THREE.CylinderGeometry(.25, 3.1, 8.4, 40, 1, true), new THREE.MeshBasicMaterial({ map: beamTex, color: 0x9fb4d8, transparent: true, opacity: .16, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide }));
  beam.position.set(.2, 4.3, .9); scene.add(beam);

  // dust in the beam
  var N = 420, dp = new Float32Array(N * 3), r3 = rnd(9);
  for (var d = 0; d < N; d++) { var a = r3() * Math.PI * 2, rr = Math.sqrt(r3()) * 2.4, y = r3() * 7.5; dp.set([Math.cos(a) * rr * (y / 7.5 * .3 + .7), y, Math.sin(a) * rr], d * 3); }
  var dg = new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.BufferAttribute(dp, 3));
  var dustPts = new THREE.Points(dg, new THREE.PointsMaterial({ color: 0xcfd8e6, size: .025, transparent: true, opacity: .6, depthWrite: false })); scene.add(dustPts);


  /* ---------- glossy finish on everything (clearcoat + lower roughness) ---------- */
  (function glossify() {
    var cache = new Map();
    function conv(m) {
      if (!m || !m.isMeshStandardMaterial || m.transparent) return m;
      if (cache.has(m)) return cache.get(m);
      var p = m.isMeshPhysicalMaterial ? m : new THREE.MeshPhysicalMaterial();
      if (p !== m) { THREE.MeshStandardMaterial.prototype.copy.call(p, m); p.defines = { STANDARD: "", PHYSICAL: "" }; }
      var matte = m.roughness >= .88;
      p.roughness = matte ? Math.max(.35, m.roughness * .6) : Math.max(.05, m.roughness * .4);
      p.clearcoat = matte ? .35 : 1; p.clearcoatRoughness = matte ? .3 : .06;
      p.envMapIntensity = (m.envMapIntensity || 1) * 1.5;
      p.needsUpdate = true; cache.set(m, p); return p;
    }
    scene.traverse(function (o) { if (!o.isMesh) return; o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material); });
  })();

  /* ---------- post: bloom + grain/vignette ---------- */
  var composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  var bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), .55, .5, .82); composer.addPass(bloom);
  var grade = new THREE.ShaderPass({
    uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
    vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
    fragmentShader: "uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv;" +
      "float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime) * 43758.5453); }" +
      "void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - .5; float v = smoothstep(.85, .25, length(d)); c.rgb *= mix(.45, 1.0, v); c.rgb += (h(vUv * 800.0) - .5) * .035; c.rgb = mix(c.rgb, c.rgb * vec3(.92,.97,1.06), .5); gl_FragColor = c; }"
  });
  composer.addPass(grade);

  /* ---------- controls ---------- */
  var rotY = .55, vel = 0, drag = null, camT = 0;
  canvas.addEventListener("pointerdown", function (e) { drag = { x: e.clientX, r: rotY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", function (e) { if (!drag) return; var n = drag.r + (e.clientX - drag.x) * .012; vel = n - rotY; rotY = n; });
  canvas.addEventListener("pointerup", function () { drag = null; });
  window.addEventListener("keydown", function (e) { if (e.key === "ArrowLeft") rotY -= .2; if (e.key === "ArrowRight") rotY += .2; });
  document.getElementById("b-spin").addEventListener("click", function () { spin = !spin; this.setAttribute("aria-pressed", spin); });
  document.getElementById("b-close").addEventListener("click", function () { close = !close; this.setAttribute("aria-pressed", close); });

  var portrait = false;
  function resize() {
    var w = innerWidth, h = innerHeight; portrait = w < h;
    var pr = Math.min(devicePixelRatio || 1, isPhone ? 1.5 : 2);
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    composer.setPixelRatio(pr); composer.setSize(w, h);
    bloom.resolution.set(w / 2, h / 2);
    camera.aspect = w / h; camera.fov = portrait ? 50 : 34; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  var clock = new THREE.Clock();
  var far = new THREE.Vector3(), near = new THREE.Vector3();
  function frame() {
    var dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
    if (!drag) { if (spin) rotY += dt * .3; rotY += vel; vel *= .9; }
    turn.rotation.y = rotY;
    camT += ((close ? 1 : 0) - camT) * Math.min(1, dt * 3);
    far.set(0, 2.6, portrait ? 8.6 : 7.4); near.set(.35, 2.15, portrait ? 3.6 : 3.1);
    camera.position.lerpVectors(far, near, camT);
    camera.lookAt(0, 1.45 + camT * .45, 0);
    stageTick(reduce ? 0 : t);
    if (!reduce) { dustPts.rotation.y = t * .02; dustPts.position.y = Math.sin(t * .3) * .05; }
    grade.uniforms.uTime.value = t % 10;
    composer.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
