<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>El escondite de rainn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-screen 3D scene; HUD on the edges; content opens in a side panel (desktop) or bottom sheet (phone). Single dark look on purpose. */
:root {
  --bg: #050608;
  --panel: #0c0e12;
  --panel-2: #14171d;
  --line: #262a32;
  --fg: #f1f1f1;
  --muted: #b3b8c2;
  --dim: #7d838e;
  --red: #ff2338;
  --red-soft: #ff5c6c;
  --ice: #8fd3ff;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --glass: rgba(10,12,16,.62);
  --display: "Inter Tight", "Inter", system-ui, sans-serif;
  --body: "Inter", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
body.desktop #scene { cursor: none; }
body.desktop.panel-open #scene { cursor: default; }

/* crosshair */
#mira { position: fixed; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; pointer-events: none; z-index: 5; transition: opacity 200ms ease; will-change: transform; }
#mira svg { width: 100%; height: 100%; overflow: visible; transition: transform 220ms var(--ease-out); }
#mira .ring, #mira .tick { transition: stroke-width 160ms ease, opacity 160ms ease; }
#mira .ring { fill: none; stroke: var(--red); stroke-width: 2.4; opacity: .9; }
#mira .tick { stroke: var(--red); stroke-width: 2.4; }
#mira .dot { fill: var(--red); }
#mira.locked svg { transform: rotate(45deg) scale(.82); }
#mira.locked .ring { stroke-width: 3.2; opacity: 1; filter: drop-shadow(0 0 6px rgba(255,35,56,.8)); }
body.panel-open #mira, body.focus #mira, body.focus #lock-label { opacity: 0; }
body.focus .hud-bottom, body.focus #hint { opacity: 0; pointer-events: none; }
.hud-bottom { transition: opacity 200ms ease; }

#lock-label { position: fixed; z-index: 6; pointer-events: none; transform: translate(26px, -50%); display: flex; flex-direction: column; gap: 2px; padding: 9px 13px; background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.08); border-left: 3px solid var(--red); white-space: nowrap; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
#lock-label:not([hidden]) { animation: lockIn 180ms var(--ease-out); }
@keyframes lockIn { from { opacity: 0; translate: -6px 0; } }
#lock-label .n { font-family: var(--display); font-weight: 700; font-size: 17px; }
#lock-label .s { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
body.touch #mira, body.touch #lock-label { display: none; }
body.touch #intro .demo { display: none; }
.tap { position: fixed; z-index: 5; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: 2px solid var(--red); border-radius: 50%; pointer-events: none; opacity: .9; transform: scale(.35); animation: tapRing 420ms var(--ease-out) forwards; }
@keyframes tapRing { to { transform: scale(1.4); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tap { animation: tapFade 300ms ease forwards; transform: none; } @keyframes tapFade { to { opacity: 0; } } }
#open-chip { display: none; margin-top: 8px; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .04em; color: #fff; background: var(--red); border: 0; padding: 10px 16px; min-height: 40px; cursor: pointer; transition: transform 140ms var(--ease-out); box-shadow: 0 6px 18px rgba(255,35,56,.35); }
#open-chip:active { transform: scale(.96); }

/* HUD */
.hud-top { position: fixed; z-index: 4; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.brand { display: flex; flex-direction: column; gap: 2px; pointer-events: auto; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.03em; line-height: 1; }
.brand span { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
#snd { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.08); padding: 7px 10px; min-height: 32px; cursor: pointer; transition: transform 140ms var(--ease-out), color 150ms ease; }
#snd:active { transform: scale(.96); }
#snd i { width: 14px; height: 10px; display: flex; align-items: flex-end; gap: 2px; }
#snd i::before, #snd i::after { content: ""; width: 3px; background: var(--red); animation: eq 900ms ease-in-out infinite alternate; }
#snd i::before { height: 60%; } #snd i::after { height: 100%; animation-delay: -450ms; }
#snd[aria-pressed="false"] i::before, #snd[aria-pressed="false"] i::after { animation: none; height: 2px; background: var(--dim); }
@keyframes eq { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { #snd i::before, #snd i::after { animation: none; } }
.map-wrap { pointer-events: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#minimap { width: 144px; height: 120px; background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.08); display: block; }
.map-wrap span { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }

.hud-bottom { position: fixed; z-index: 4; left: 0; right: 0; bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(to top, rgba(5,6,8,.92), rgba(5,6,8,0)); padding-top: 28px; }
#menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 1100px; margin: 0 auto; }
#menu button { font-family: var(--body); font-size: 14px; font-weight: 600; color: var(--muted); background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.08); padding: 9px 13px; min-height: 40px; cursor: pointer; transition: transform 140ms var(--ease-out), color 150ms ease, border-color 150ms ease, background-color 150ms ease; }
#menu button:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { #menu button:hover { color: #fff; border-color: rgba(255,255,255,.22); } }
#menu button.hot { color: #fff; border-color: var(--red); background: rgba(255,35,56,.14); }
#menu button:focus-visible, .panel button:focus-visible, .panel a:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
#sec-btn { display: none; }
@media (max-width: 700px), (pointer: coarse) {
  #menu { display: none; }
  .hud-bottom { display: flex; justify-content: center; }
  #sec-btn { display: inline-flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 17px; color: #fff; background: var(--glass); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255,255,255,.12); padding: 14px 22px; min-height: 52px; cursor: pointer; transition: transform 140ms var(--ease-out); box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  #sec-btn:active { transform: scale(.97); }
  #sec-btn .ic { display: grid; grid-template-columns: repeat(2, 5px); gap: 3px; }
  #sec-btn .ic i { width: 5px; height: 5px; background: var(--red); }
  #sec-btn .ct { font-family: var(--mono); font-size: 12px; color: var(--dim); font-weight: 500; }
  #minimap { width: 104px; height: 88px; }
  .brand b { font-size: 24px; }
}
body.panel-open.touch .hud-bottom { display: none; }
@media (min-width: 701px) and (pointer: fine) { body.panel-open .hud-bottom { right: min(480px, 100%); } }

/* hint + intro */
#hint { position: fixed; z-index: 4; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); font-family: var(--mono); font-size: 12px; letter-spacing: .05em; color: var(--fg); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.08); padding: 9px 14px; opacity: 0; transition: opacity 200ms ease, transform 200ms var(--ease-out); pointer-events: none; text-align: center; white-space: nowrap; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 8px; }
#hint::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--red); box-shadow: 0 0 8px var(--red); flex: 0 0 auto; }
#hint.show { opacity: 1; transform: translate(-50%, 0); transition: opacity 300ms ease, transform 400ms var(--ease-out); }
#intro { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); transition: opacity 500ms ease; }
#intro.gone { opacity: 0; pointer-events: none; }
#intro-ready > * { animation: introIn 600ms var(--ease-out) both; }
#intro-ready > :nth-child(2) { animation-delay: 60ms; }
#intro-ready > :nth-child(3) { animation-delay: 110ms; }
#intro-ready > :nth-child(4) { animation-delay: 150ms; }
@keyframes introIn { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } }
#intro.gone #intro-ready { transform: scale(1.03); transition: transform 500ms var(--ease-out); }
#intro .bar { width: 220px; height: 4px; background: var(--line); }
#intro .bar i { display: block; height: 100%; width: 0; background: var(--red); transition: width 250ms var(--ease-out); box-shadow: 0 0 10px rgba(255,35,56,.6); }
#intro .t { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
#intro h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6vw, 48px); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
#intro button { font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: .1em; color: #fff; background: var(--red); border: 0; padding: 15px 30px; min-height: 52px; cursor: pointer; text-transform: uppercase; transition: transform 140ms var(--ease-out), box-shadow 200ms ease; box-shadow: 0 10px 30px rgba(255,35,56,.3); }
#intro button:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { #intro button:hover { box-shadow: 0 10px 40px rgba(255,35,56,.5); } }
#intro .demo { width: 64px; height: 64px; }

/* panel */
.panel { position: fixed; z-index: 10; background: var(--panel); border-left: 1px solid var(--line); top: 0; right: 0; bottom: 0; width: min(480px, 100%); transform: translateX(105%); transition: transform 260ms var(--ease-out); box-shadow: -30px 0 60px rgba(0,0,0,.5); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.panel.open { transform: none; transition: transform 420ms var(--ease-drawer); }
.panel.open .panel-body > * { animation: introIn 380ms var(--ease-out) both; }
.panel.open .panel-body > :nth-child(2) { animation-delay: 40ms; }
.panel.open .panel-body > :nth-child(3) { animation-delay: 75ms; }
.panel.open .panel-body > :nth-child(n+4) { animation-delay: 100ms; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.panel-head .eb { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--red-soft); }
#back { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); padding: 10px 14px; min-height: 44px; cursor: pointer; transition: transform 140ms var(--ease-out), border-color 150ms ease; }
#back:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { #back:hover { border-color: var(--red); } }
.panel-body { overflow-y: auto; padding: 22px 20px calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.panel h2 { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -.02em; line-height: 1.05; margin: 0; text-wrap: balance; }
.panel p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 16px; }
.panel p strong { color: var(--fg); }
.pend { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #ffd3d8; background: rgba(255,35,56,.16); border: 1px dashed rgba(255,35,56,.6); padding: 2px 6px; vertical-align: middle; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.row .l { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row .l b { font-family: var(--display); font-weight: 700; font-size: 18px; }
.row .l span { font-size: 14px; color: var(--dim); }
.row .r { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; flex: 0 0 auto; }
.big { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: -.02em; color: var(--fg); font-variant-numeric: tabular-nums; }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.card { background: var(--panel-2); border: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card b { font-family: var(--display); font-weight: 700; font-size: 17px; }
.card span { font-size: 14px; color: var(--muted); line-height: 1.45; }
.swatch { width: 18px; height: 18px; border-radius: 50%; }
.slot { aspect-ratio: 16 / 9; max-width: 100%; background: repeating-linear-gradient(45deg, #101318 0 10px, #0c0e12 10px 20px); border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; text-align: center; padding: 8px; }
.slot.sq { aspect-ratio: 1 / 1; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cta:active, .tabs button:active, .copyline button:active { transform: scale(.97); }
.cta, .tabs button, .copyline button { transition: transform 140ms var(--ease-out), border-color 150ms ease, color 150ms ease; }
.cta { align-self: flex-start; font-family: var(--mono); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--red); padding: 13px 18px; text-decoration: none; }
.tabs { display: flex; gap: 6px; }
.tabs button { font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); padding: 10px 14px; min-height: 44px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: #fff; border-color: var(--red); }
.progress { height: 8px; background: var(--line); }
.progress i { display: block; height: 100%; background: var(--red); }
.copyline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copyline code { font-family: var(--mono); font-size: 16px; color: var(--fg); user-select: all; word-break: break-all; }
.copyline button { font-family: var(--mono); font-size: 12px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); padding: 8px 10px; cursor: pointer; }
.panel a.lk { color: var(--fg); text-decoration-color: var(--red); text-underline-offset: 3px; }
.note { font-family: var(--mono); font-size: 12px; color: var(--dim); letter-spacing: .04em; }

@media (max-width: 700px), (pointer: coarse) {
  .panel { top: auto; left: 0; width: 100%; height: 56%; border-left: 0; border-top: 2px solid var(--red); transform: translateY(100%); padding-top: 0; background: var(--panel); box-shadow: 0 -30px 60px rgba(0,0,0,.6); }
  .panel-head { padding: 12px 20px; }
  .panel-body { padding-left: max(20px, env(safe-area-inset-left, 0px)); }
  .panel p { font-size: 17px; color: #c9ced6; }
  .panel.open { transform: none; }
  .panel h2 { font-size: 28px; }
}
#sheet { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
#sheet .bd { position: absolute; inset: 0; background: rgba(0,0,0,.55); opacity: 0; transition: opacity 200ms ease; }
#sheet .sh { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 2px solid var(--red); padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); transform: translateY(100%); transition: transform 240ms var(--ease-out); box-shadow: 0 -30px 60px rgba(0,0,0,.6); }
#sheet.open { pointer-events: auto; }
#sheet.open .bd { opacity: 1; }
#sheet.open .sh { transform: none; transition: transform 420ms var(--ease-drawer); }
#sheet .sh-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
#sheet .sh-top b { font-family: var(--display); font-weight: 800; font-size: 24px; letter-spacing: -.02em; }
#sheet .sh-top span { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
#sheet-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
#sheet-list button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); padding: 13px 14px; min-height: 64px; cursor: pointer; transition: transform 140ms var(--ease-out), border-color 150ms ease; }
#sheet-list button small { font-family: var(--mono); font-weight: 500; font-size: 11px; letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
#sheet-list button:active { transform: scale(.97); border-color: var(--red); }
#sheet.open #sheet-list button { animation: introIn 320ms var(--ease-out) both; }
#sheet.open #sheet-list button:nth-child(n+3) { animation-delay: 35ms; }
#sheet.open #sheet-list button:nth-child(n+5) { animation-delay: 65ms; }
#sheet.open #sheet-list button:nth-child(n+7) { animation-delay: 90ms; }
#sheet.open #sheet-list button:nth-child(n+9) { animation-delay: 110ms; }
@media (prefers-reduced-motion: reduce) {
  .panel, .panel.open, #intro, #mira, #mira svg, #hint, #sheet .sh, #sheet.open .sh { transition: opacity 200ms ease; }
  #lock-label, #intro-ready > *, .panel.open .panel-body > *, #sheet.open #sheet-list button { animation: none; }
}
/* rainn text box: old RPG style, kept dark and serious */
#dlg { position: fixed; z-index: 9; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: min(640px, calc(100% - 24px)); transform: translate(-50%, 14px); opacity: 0; transition: opacity 160ms ease, transform 200ms var(--ease-out); }
#dlg.show { opacity: 1; transform: translate(-50%, 0); transition: opacity 220ms ease, transform 360ms var(--ease-drawer); }
#dlg .dlg-box { position: relative; background: #07080a; border: 3px solid #e9e9e9; box-shadow: inset 0 0 0 3px #07080a, inset 0 0 0 5px #5a5f68, 0 18px 50px rgba(0,0,0,.7); padding: 20px 24px 24px; min-height: 104px; cursor: pointer; }
#dlg-text { margin: 0; font-family: var(--mono); font-size: 18px; line-height: 1.65; color: #f4f4f4; letter-spacing: .01em; white-space: pre-wrap; }
#dlg .dlg-more { position: absolute; right: 18px; bottom: 10px; color: var(--red); font-size: 14px; opacity: 0; }
#dlg.more .dlg-more { opacity: 1; animation: dlgBlink 900ms steps(2, start) infinite; }
@keyframes dlgBlink { to { visibility: hidden; } }
#dlg-opts { position: absolute; right: 0; bottom: calc(100% + 8px); display: flex; flex-direction: column; background: #07080a; border: 3px solid #e9e9e9; box-shadow: inset 0 0 0 3px #07080a, inset 0 0 0 5px #5a5f68; padding: 10px 8px; }
#dlg-opts button { font-family: var(--mono); font-size: 16px; font-weight: 700; color: #f4f4f4; background: none; border: 0; text-align: left; padding: 10px 14px 10px 30px; min-height: 44px; cursor: pointer; position: relative; }
#dlg-opts button.sel::before { content: "▶"; position: absolute; left: 8px; color: var(--red); font-size: 13px; top: 50%; transform: translateY(-50%); }
#dlg-opts button:focus-visible { outline: 2px solid var(--red); outline-offset: -2px; }
body.talking .hud-bottom, body.talking #hint { opacity: 0; pointer-events: none; }
@media (max-width: 700px) { #dlg-text { font-size: 16px; } #dlg .dlg-box { padding: 16px 18px 22px; } }
@media (prefers-reduced-motion: reduce) { #dlg, #dlg.show { transition: opacity 200ms ease; transform: translate(-50%, 0); } }

/* focus card: first step after tapping an object */

  window.addEventListener("keydown", function (e) {
    if (!talk.on) return;
    if (!dlgOpts.hidden && (e.key === "ArrowUp" || e.key === "ArrowDown")) { talk.sel = 1 - talk.sel; markOpt(); sfx("hover"); e.preventDefault(); return; }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!dlgOpts.hidden) choose(talk.sel); else advance(); }
  });

  // Step 2: the full section.
  function openSection(i) {
    var s = SECTIONS[i];
    activeIdx = i; hideLock(); sfx("open"); updateMusic();
    panelEb.textContent = s.obj + " · " + s.name;
    panelBody.innerHTML = s.html;
    menu.querySelectorAll("button").forEach(function (b) { b.classList.toggle("hot", +b.dataset.i === i); });
    document.body.classList.add("panel-open"); camShift.target = narrowView() ? .28 : 0;
    panel.setAttribute("aria-hidden", "false");
    var reveal = function () { panel.classList.add("open"); panelBody.scrollTop = 0; if (!isTouch) setTimeout(function () { document.getElementById("back").focus({ preventScroll: true }); }, 50); };
    if (gl) { objects.forEach(function (o, k) { o.light.intensity = k === i ? LAMP * 1.4 : LAMP * .45; }); startTween(viewFor(i), 1.1, reveal); setTimeout(reveal, 450); } else reveal();
    hideHint(); lastAction = performance.now();
  }
  function closeSection() {
    if (activeIdx < 0) return;
    sfx("back");
    if (fromFocus) { var back = activeIdx; fromFocus = false; panel.classList.remove("open"); panel.setAttribute("aria-hidden", "true"); document.body.classList.remove("panel-open"); menu.querySelectorAll("button").forEach(function (b) { b.classList.remove("hot"); }); focusSection(back); return; }
    activeIdx = -1; camShift.target = 0; updateMusic();
    panel.classList.remove("open"); panel.setAttribute("aria-hidden", "true");
    document.body.classList.remove("panel-open");
    menu.querySelectorAll("button").forEach(function (b) { b.classList.remove("hot"); });
    if (gl) { objects.forEach(function (o) { o.light.intensity = LAMP; }); startTween(orbitPose(orbit.theta, { pos: new THREE.Vector3(), look: new THREE.Vector3() }), 1.0, null); }
    lastAction = performance.now();
  }

  /* ---------- hover / lock ---------- */
  var mouse = new THREE.Vector2(0, 0), mouseClient = { x: innerWidth / 2, y: innerHeight / 2 }, haveMouse = false;
  function setHover(i) {
    if (i === hoverIdx) return;
    hoverIdx = i;
    objects.forEach(function (o, k) { o.light.intensity = activeIdx >= 0 ? o.light.intensity : (k === i ? LAMP * 1.6 : LAMP); o.pool.material.opacity = k === i ? .12 : .05; });
    if (i < 0) { hideLock(); return; }
    sfx("hover");
    mira.classList.add("locked");
    lockLabel.hidden = false;
    lockLabel.querySelector(".n").textContent = i === RAINN ? "rainn" : SECTIONS[i].obj;
    lockLabel.querySelector(".s").textContent = i === RAINN ? "Shhh…" : SECTIONS[i].name;
    hideHint();
  }
  function hideLock() { mira.classList.remove("locked"); lockLabel.hidden = true; }
  function pick(ndcX, ndcY) {
    raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
    var h = raycaster.intersectObjects(hitBoxes, false);
    return h.length ? h[0].object.userData.idx : -1;
  }

  /* ---------- input ---------- */
  var drag = null;
  function aimAt(x, y) { touchAim.x = x; touchAim.y = y; mira.style.transform = "translate(" + x + "px," + y + "px)"; lockLabel.style.left = x + "px"; lockLabel.style.top = y + "px"; }
  if (isTouch) aimAt(innerWidth / 2, innerHeight / 2);
  canvas.addEventListener("pointerdown", function (e) {
    if (talk.on) { advance(); return; }
    if (focusIdx >= 0) { drag = { x: e.clientX, y: e.clientY, theta: orbit.target, moved: false, dismiss: true }; return; }
    if (activeIdx >= 0) return;
    drag = { x: e.clientX, y: e.clientY, theta: orbit.target, moved: false }; canvas.setPointerCapture(e.pointerId);
    if (isTouch) aimAt(e.clientX, e.clientY);
  });
  canvas.addEventListener("pointermove", function (e) {
    mouseClient.x = e.clientX; mouseClient.y = e.clientY; haveMouse = true;
    if (!isTouch) aimAt(e.clientX, e.clientY);

      if (Math.abs(dx) > 5 || Math.abs(e.clientY - drag.y) > 5) drag.moved = true;

    }
  });
  canvas.addEventListener("pointerup", function (e) {
    if (!drag) return;
    var wasDrag = drag.moved, dismiss = drag.dismiss; drag = null;
    if (isTouch && !wasDrag) { var tp = document.createElement("div"); tp.className = "tap"; tp.style.left = e.clientX + "px"; tp.style.top = e.clientY + "px"; document.body.appendChild(tp); setTimeout(function () { tp.remove(); }, 500); }
    if (dismiss) { if (!wasDrag) unfocus(); return; }
    if (wasDrag || activeIdx >= 0) return;
    var i = pick((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    if (i === RAINN) talkRainn(); else if (i >= 0) focusSection(i);
  });
  canvas.addEventListener("pointerleave", function () { if (!isTouch) { setHover(-1); mira.style.opacity = 0; } });
  canvas.addEventListener("pointerenter", function () { if (!isTouch) mira.style.opacity = ""; });
  window.addEventListener("keydown", function (e) { if (activeIdx >= 0) return; if (e.key === "ArrowLeft") orbit.target += .25; if (e.key === "ArrowRight") orbit.target -= .25; });

  /* ---------- hints ---------- */
  var lastAction = performance.now(), hintShown = false;
  var hintTimer;
  function showHint() { hint.textContent = isTouch ? "Toca un objeto · desliza para girar" : "Apunta a un objeto y haz click"; hint.classList.add("show"); hintShown = true; clearTimeout(hintTimer); hintTimer = setTimeout(hideHint, 5000); }
  function hideHint() { hint.classList.remove("show"); }

  /* ---------- minimap ---------- */
  var mm = document.getElementById("minimap"), mctx = mm.getContext("2d");
  function drawMap() {
    var W = mm.width, H = mm.height, sx = function (x) { return (x + 26) / 52 * W; }, sz = function (z) { return (z + 22) / 44 * H; };
    mctx.clearRect(0, 0, W, H);
    mctx.strokeStyle = "#3a3f48"; mctx.lineWidth = 2; mctx.strokeRect(sx(-25), sz(-21), sx(25) - sx(-25), sz(21) - sz(-21));
    mctx.fillStyle = "#1c2026"; mctx.fillRect(sx(-9), sz(-18), sx(9) - sx(-9), sz(-12) - sz(-18));
    mctx.strokeStyle = "#ff2338"; mctx.lineWidth = 2; mctx.beginPath(); mctx.arc(sx(0), sz(0), 9, 0, Math.PI * 2); mctx.stroke();
    SECTIONS.forEach(function (s, i) {
      var p = LAYOUT[s.id]; var hot = i === hoverIdx || i === activeIdx;
      mctx.fillStyle = hot ? "#ff2338" : "#cfd5de"; mctx.beginPath(); mctx.arc(sx(p[0]), sz(p[1]), hot ? 7 : 4.5, 0, Math.PI * 2); mctx.fill();
    });
    if (gl) {
      var cx = sx(camera.position.x), cz = sz(camera.position.z), dir = new THREE.Vector3(); camera.getWorldDirection(dir);
      var a = Math.atan2(dir.z, dir.x);
      mctx.fillStyle = "rgba(255,255,255,.18)"; mctx.beginPath(); mctx.moveTo(cx, cz); mctx.arc(cx, cz, 70, a - .45, a + .45); mctx.closePath(); mctx.fill();
      mctx.fillStyle = "#ffffff"; mctx.beginPath(); mctx.arc(cx, cz, 5, 0, Math.PI * 2); mctx.fill();
    }
  }

  /* ---------- glossy finish on everything (clearcoat + lower roughness) ---------- */
  function glossify() {
    var cache = new Map();
    function conv(m) {
      if (!m || !m.isMeshStandardMaterial || m.transparent || (m.userData && m.userData.matte)) return m;
      if (cache.has(m)) return cache.get(m);
      var p = m.isMeshPhysicalMaterial ? m : new THREE.MeshPhysicalMaterial();
      if (p !== m) { THREE.MeshStandardMaterial.prototype.copy.call(p, m); p.defines = { STANDARD: "", PHYSICAL: "" }; }
      var matte = m.roughness >= .88;
      p.roughness = matte ? Math.max(.35, m.roughness * .6) : Math.max(.05, m.roughness * .4);
      p.clearcoat = matte ? .35 : 1; p.clearcoatRoughness = matte ? .3 : .06;
      p.envMapIntensity = (m.envMapIntensity || 1) * 1.5;
      p.needsUpdate = true; cache.set(m, p); return p;
    }
    scene.traverse(function (o) { if (!o.isMesh) return; o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material); });
  }


  /* ---------- render ---------- */
  // Phones start sharper (1.5x) and drop to 1x on their own if the frame rate suffers.
  var prCap = isTouch ? 1.5 : 1.5, perf = { n: 0, sum: 0, done: !isTouch };
  function resize() {
    if (!gl) return;
    var w = innerWidth, h = innerHeight;
    var pr = Math.min(devicePixelRatio || 1, prCap);
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    if (composer) { composer.setPixelRatio(pr); composer.setSize(w, h); bloom.resolution.set(w / 2, h / 2); }
    camera.aspect = w / h;
    camera.fov = w < h ? 64 : 50;
    orbit.radius = w < h ? 20 : (isTouch ? 19 : 17);
    camera.updateProjectionMatrix();
    if (activeIdx < 0 && !tween) { orbitPose(orbit.theta, camState); }
  }

  function frame() {
    var raw = clock.getDelta(), dt = Math.min(raw, .05), t = clock.elapsedTime;
    if (!perf.done && introDone) { perf.n++; if (perf.n > 20) perf.sum += raw; if (perf.n === 110) { perf.done = true; if (perf.sum / 90 > 1 / 40) { prCap = 1; resize(); } } }
    if (activeIdx < 0 && !tween) {
      orbit.theta += (orbit.target - orbit.theta) * Math.min(1, dt * 6);
      if (!reduceMotion && performance.now() - lastAction > 9000) orbit.target += dt * .04;
      orbitPose(orbit.theta, camState);
      if (!isTouch && haveMouse) { camState.look.x += ((mouseClient.x / innerWidth) - .5) * .8; camState.look.y += (.5 - (mouseClient.y / innerHeight)) * .5; }
    }
    if (tween) {
      tween.t += dt / tween.dur; var k = ease(Math.min(1, tween.t));
      camState.pos.lerpVectors(tween.from.pos, tween.to.pos, k); camState.look.lerpVectors(tween.from.look, tween.to.look, k);
      if (tween.t >= 1) { var d = tween.done; tween = null; if (d) d(); }
    }
    camera.position.copy(camState.pos); camera.lookAt(camState.look);
    camShift.cur += (camShift.target - camShift.cur) * Math.min(1, dt * 4.5);
    if (Math.abs(camShift.cur) > .002) camera.setViewOffset(innerWidth, innerHeight, 0, camShift.cur * innerHeight, innerWidth, innerHeight);
    else if (camera.view && camera.view.enabled) camera.clearViewOffset();

    if (activeIdx < 0 && !tween) {
      if (!isTouch && haveMouse) setHover(pick((mouseClient.x / innerWidth) * 2 - 1, -(mouseClient.y / innerHeight) * 2 + 1));
    }
    if (!reduceMotion) {
      var p = rain.geometry.attributes.position.array;
      for (var i = 0; i < p.length; i += 6) { p[i + 1] -= dt * 14; p[i + 4] -= dt * 14; if (p[i + 4] < 0) { p[i + 1] = 11.4; p[i + 4] = 10.9; } }
      rain.geometry.attributes.position.needsUpdate = true;
      splashes.forEach(function (sp) {
        var k = ((t + sp.userData.t0) % 1.2) / .45;
        if (k > 1) { sp.material.opacity = 0; if (!sp.userData.placed) { var a = Math.random() * 6.28, d = .35 + Math.random() * 1.1; sp.position.set(RAINN_AT.x + Math.cos(a) * d, .035, RAINN_AT.z + Math.sin(a) * d); sp.userData.placed = true; } return; }
        sp.userData.placed = false; sp.scale.setScalar(1 + k * 4); sp.material.opacity = .45 * (1 - k);
      });
      dust.rotation.y = t * .01;
      objects[0].group.children.forEach(function (c) { if (c.userData.spin) c.rotation.y = t * .6; });
      ticks.forEach(function (fn) { fn(t); });
    }
    if (!hintShown && activeIdx < 0 && performance.now() - lastAction > 6000 && introDone) showHint();
    grade.uniforms.uTime.value = t % 10; composer.render();
    drawMap();
    requestAnimationFrame(frame);
  }

  var introDone = false;
  function finishIntro() {
    introDone = true; lastAction = performance.now();
    document.getElementById("intro").classList.add("gone");
    try { localStorage.setItem("rainn-escondite-visto", "1"); } catch (e) {}
  }

  function init() {
    var bar = document.getElementById("intro-bar");
    if (gl) {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x040507);
      scene.fog = new THREE.FogExp2(0x040507, .022);
      camera = new THREE.PerspectiveCamera(50, 1, .1, 120);
      raycaster = new THREE.Raycaster();
      clock = new THREE.Clock();
      renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = !isTouch; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      maxAniso = renderer.capabilities.getMaxAnisotropy();
      (function () {
        var env = new THREE.Scene(); env.add(new THREE.Mesh(new THREE.BoxGeometry(20, 12, 20), new THREE.MeshBasicMaterial({ color: 0x07090c, side: THREE.BackSide })));
        var panel = function (x, y, z, w, h, c, ry, rx) { var m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide })); m.position.set(x, y, z); m.rotation.set(rx || 0, ry || 0, 0); env.add(m); };
        panel(0, 5.9, 0, 3, 3, 0xe8f0ff, 0, Math.PI / 2); panel(-4, 5.9, -3, .3, 6, 0xcfdcff, 0, Math.PI / 2); panel(4, 5.9, 3, .3, 6, 0xcfdcff, 0, Math.PI / 2);
        panel(-9.9, 4.5, -4, 6, .25, 0x9fb0cc, Math.PI / 2); panel(9.9, 4.5, 4, 6, .25, 0x9fb0cc, -Math.PI / 2); panel(0, 2, -9.9, 2, 1, 0x8a1020);
        scene.environment = new THREE.PMREMGenerator(renderer).fromScene(env, .04).texture;
      })();
      scene.add(new THREE.AmbientLight(0x2a3444, .25));
      scene.add(new THREE.HemisphereLight(0x5a6c88, 0x050505, .22));
      bar.style.width = "30%";
      buildRoom(); bar.style.width = "60%";
      buildObjects(); buildAtmos(); buildLife(); buildHome(); buildDogs(); glossify(); bar.style.width = "100%";
      if (isTouch) scene.traverse(function (o) { if (o.isPointLight) o.visible = false; });
      composer = new THREE.EffectComposer(renderer); composer.addPass(new THREE.RenderPass(scene, camera));
      bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256, 256), .55, .5, .82); composer.addPass(bloom);
      grade = new THREE.ShaderPass({ uniforms: { tDiffuse: { value: null }, uTime: { value: 0 } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader: "uniform sampler2D tDiffuse; uniform float uTime; varying vec2 vUv; float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime) * 43758.5453); } void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - .5; float v = smoothstep(.9, .3, length(d)); c.rgb *= mix(.5, 1.0, v); c.rgb += (h(vUv * 800.0) - .5) * .03; c.rgb = mix(c.rgb, c.rgb * vec3(.92,.97,1.06), .5); gl_FragColor = c; }" });
      composer.addPass(grade);
      orbitPose(0, camState);
      resize(); resize();
      window.addEventListener("resize", resize);
      requestAnimationFrame(frame);
    } else { bar.style.width = "100%"; introDone = true; }
    var seen = false; try { seen = localStorage.getItem("rainn-escondite-visto") === "1"; } catch (e) {}
    if (isTouch) { document.getElementById("intro-h").textContent = "Explora el escondite"; document.getElementById("intro-sub").textContent = "Toca un objeto para ver qué es. Desliza para girar."; }
    setTimeout(function () {
      document.getElementById("intro-t").hidden = true; document.querySelector("#intro .bar").hidden = true;
      if (seen) { finishIntro(); return; }
      var ready = document.getElementById("intro-ready"); ready.hidden = false;
      document.getElementById("enter").addEventListener("click", finishIntro);
      setTimeout(finishIntro, 3500);
    }, 700);
  }
  init();
})();
