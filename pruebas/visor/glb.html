<!doctype html><html><body style="margin:0;background:#888">
<canvas id="c" width="800" height="800"></canvas>
<script src="../../escondite/vendor/three.min.js"></script>
<script src="../../escondite/vendor/GLTFLoader.js"></script>
<script>
// Visor de prueba: ?glb=ruta&yaw=grados&zoom=cara
var q=new URLSearchParams(location.search);
var r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});r.outputEncoding=THREE.sRGBEncoding;
var s=new THREE.Scene();s.background=new THREE.Color(0x9a9a9a);
s.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));var d=new THREE.DirectionalLight(0xffffff,1.2);d.position.set(2,3,4);s.add(d);
var cam=new THREE.PerspectiveCamera(30,1,.01,100);
new THREE.GLTFLoader().load(q.get('glb'),function(g){var m=g.scene;s.add(m);
 var b=new THREE.Box3().setFromObject(m),sz=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
 window.info={size:sz.toArray(),center:c.toArray(),min:b.min.toArray(),max:b.max.toArray()};
 var yaw=(+q.get('yaw')||0)*Math.PI/180, R=Math.max(sz.x,sz.y,sz.z)*2.2, tgt=c.clone();
 if(q.get('zoom')){tgt.y=b.max.y-sz.y*.12;R=sz.y*.55;}
 cam.position.set(tgt.x+Math.sin(yaw)*R,tgt.y+(q.get('zoom')?0:sz.y*.15),tgt.z+Math.cos(yaw)*R);cam.lookAt(tgt);
 r.render(s,cam);window.done=1;});
</script></body></html>
